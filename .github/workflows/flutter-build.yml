name: Flutter and Backend CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  flutter-build:
    name: Build Flutter Client (Android)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        flutter-version: '3.44.4'
        cache: true

    - name: Install dependencies
      run: flutter pub get

    - name: Generate App Launcher Icons
      run: flutter pub run flutter_launcher_icons

    - name: Run Build Runner
      run: flutter pub run build_runner build --delete-conflicting-outputs

    - name: Run Unit Tests
      run: flutter test

    - name: Build Debug APK
      run: flutter build apk --debug

    - name: Shorebird Cloud Code Push (Optional OTA Patch)
      if: env.SHOREBIRD_TOKEN != ''
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/shorebirdtech/shorebird/main/bin/install.sh | bash
        echo "$HOME/.shorebird/bin" >> $GITHUB_PATH
        shorebird patch android --no-confirm
      continue-on-error: true
      env:
        SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: remainder-portal-apk
        path: build/app/outputs/flutter-apk/app-debug.apk

  windows-build:
    name: Build Flutter Client (Windows)
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        flutter-version: '3.44.4'
        cache: true

    - name: Install dependencies
      run: flutter pub get

    - name: Run Build Runner
      run: flutter pub run build_runner build --delete-conflicting-outputs

    - name: Build Windows Desktop
      run: flutter build windows --release

    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: remainder-portal-windows
        path: build/windows/x64/runner/Release/

  backend-check:
    name: Verify Serverless Backend
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install
      working-directory: serverless-backend

    - name: Compile TypeScript
      run: npx tsc
      working-directory: serverless-backend

  web-build:
    name: Build Flutter Client (Web)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        flutter-version: '3.44.4'
        cache: true

    - name: Install dependencies
      run: flutter pub get

    - name: Run Build Runner
      run: flutter pub run build_runner build --delete-conflicting-outputs

    - name: Build Web Release
      run: flutter build web --release
      continue-on-error: true

    - name: Upload Web Artifact
      uses: actions/upload-artifact@v4
      with:
        name: remainder-portal-web
        path: build/web/
